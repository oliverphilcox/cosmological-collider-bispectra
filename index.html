<script>
"use strict";

// ═══════════════ shared constants ═══════════════
const Delta2_zeta = 2.100549e-9, H = 1.0;
const F_pi = H / Math.pow(4.0*Math.PI*Math.PI*Delta2_zeta, 0.25);
const R = Math.pow(2.0, 1.0/8.0), sqR = Math.sqrt(R), FLOOR = 1e-30;
const OPS = ['del2pi_dotpi','dot3pi','del2pi_sigma','dot2pi_sigma','dotpi_sigma2','sigma3','delpi_delsigma_dotsigma'];

// ═══════════════ globals ═══════════════
let MODE='weak', DATA=null, COEF=null;
const DATAS={weak:null, general:null};
let sliderEls={}, valEls={}, useLogY=false, divideByX=true, activeTab='1d', plotsInitialized=false;

// ═══════════════ Lagrangian text (per mode; same formalism, weak omits alpha/mu/beta) ═══════════════
const LAG_KIN = `<p>$$\\frac{\\mathcal{L}}{a^3} = \\tfrac{1}{2}\\!\\left[\\dot{\\pi}_c^2 - c_{\\rm rel}^2\\tfrac{(\\partial_i\\pi_c)^2}{a^2}\\right] + \\tfrac{1}{2}\\!\\left[\\dot{\\sigma}_c^2 - \\tfrac{(\\partial_i\\sigma_c)^2}{a^2} - m^2\\sigma_c^2\\right] + \\color{#ff7f0e}{\\rho\\,\\dot{\\pi}_c\\,\\sigma_c}$$</p>`;
const LAG_DEF_LAM = `<p style="font-size:0.85rem;">$$c_{\\rm rel}=\\frac{c_\\pi}{c_\\sigma},\\quad \\lambda=\\frac{(1-c_\\pi^2)}{2f_\\pi^2}c_{\\rm rel}^{3/2},\\quad \\Delta\\lambda=-\\frac{1}{3}\\frac{\\tilde{c}_3}{c_\\pi^2}\\frac{(1-c_\\pi^2)}{f_\\pi^2}c_{\\rm rel}^{3/2}$$</p>`;

const LAG_WEAK = LAG_KIN
  + `<p>$$\\color{#1f77b4}{-\\,\\lambda(\\partial_\\mu\\pi_c)^2\\dot{\\pi}_c - \\Delta\\lambda\\,\\dot{\\pi}_c^3}\\;\\;\\color{#ff7f0e}{-\\,\\tfrac{\\kappa}{2}(\\partial_\\mu\\pi_c)^2\\sigma_c - \\tfrac{\\Delta\\kappa}{2}\\dot{\\pi}_c^2\\sigma_c}$$</p>`
  + LAG_DEF_LAM
  + `<p style="font-size:0.85rem;">$$\\kappa=\\frac{c_{\\rm rel}^{3/2}}{f_\\pi^2}\\rho,\\quad \\Delta\\kappa=\\frac{c_{\\rm rel}^{3/2}}{f_\\pi^2}\\Delta\\rho,\\quad f_\\pi=H(4\\pi^2\\Delta_\\zeta^2)^{-1/4}$$</p>`
  + `<p style="font-size:0.85rem; color:#666;">Weak mixing is the regime $\\rho\\lesssim H$, where the leading exchange is captured by $\\kappa,\\Delta\\kappa$; $\\tilde{c}_3$ and $\\Delta\\rho$ parametrize boost-breaking. Switch to <b>general mixing</b> for non-perturbative $\\rho$ and the additional $\\sigma^2,\\,\\sigma^3$ and $\\beta$ vertices.</p>`;

const LAG_GEN = LAG_KIN
  + `<p>$$\\color{#1f77b4}{-\\,\\lambda(\\partial_\\mu\\pi_c)^2\\dot{\\pi}_c - \\Delta\\lambda\\,\\dot{\\pi}_c^3}\\;\\;\\color{#ff7f0e}{-\\,\\tfrac{\\kappa}{2}(\\partial_\\mu\\pi_c)^2\\sigma_c - \\tfrac{\\Delta\\kappa}{2}\\dot{\\pi}_c^2\\sigma_c - \\tfrac{\\alpha}{2}\\dot{\\pi}_c\\sigma_c^2 - \\mu\\,\\sigma_c^3 - \\beta\\tfrac{\\partial_i\\pi_c\\partial_i\\sigma_c}{a^2}\\dot{\\sigma}_c}$$</p>`
  + LAG_DEF_LAM
  + `<p style="font-size:0.85rem;">$$\\kappa=\\frac{c_{\\rm rel}^{3/2}}{f_\\pi^2}\\rho,\\quad \\Delta\\kappa=\\frac{c_{\\rm rel}^{3/2}}{f_\\pi^2}\\Delta\\rho,\\quad \\beta=\\frac{c_\\sigma^{-2}-1}{f_\\pi^2}c_{\\rm rel}^{3/2},\\quad f_\\pi=H(4\\pi^2\\Delta_\\zeta^2)^{-1/4}$$</p>`
  + `<p style="font-size:0.85rem; color:#666;">Mass $m$ in units of $H$; $\\rho$ non-perturbative (weak mixing is $\\rho\\lesssim H$). Each $\\sigma$ leg requires one $\\rho$-insertion, so vertices with 1, 2, 3 $\\sigma$ fields give <b>single</b>, <b>double</b>, <b>triple</b> exchange (plotted separately). Shapes are interpolated from a finite grid and carry some residual numerical noise.</p>`;

// ═══════════════ mode configs ═══════════════
const CFG = {
  weak: {
    title:'Massive Scalar Exchange (Weak Mixing)',
    lagrangian:LAG_WEAK, xmin:1e-3,
    defaults:{m:2.92, lcpi:-1.0, lcsig:0.0, c3:0.0, rho:1.0, drho:0.0},
    groups:[['self','Self-interactions'],['mix','Weak mixing']],
    sliders:[
      ['lcpi','log₁₀ c<sub>π</sub>', -2.0, 0.0, 0.05, -1.0, 'Goldstone sound-speed','self'],
      ['c3','$\\tilde{c}_3$',        -10., 10., 0.1,  0.0, '$\\dot{\\pi}^3$ self-interaction','self'],
      ['m','m/H',                     1.5, 6.0, 0.05, 2.92,'Scalar mass','mix'],
      ['lcsig','log₁₀ c<sub>σ</sub>',-2.0, 0.0, 0.05, 0.0, 'Scalar sound-speed','mix'],
      ['rho','ρ/H',                 -10.,10., 0.05, 1.0, '$\\dot{\\pi}\\sigma$ mixing','mix'],
      ['drho','Δρ/H',              -250.,250.,0.5,  0.0, '$\\dot{\\pi}^2\\sigma$ weak mixing','mix'],
    ],
    fmt:(k,v)=>{ if(k==='m'||k==='lcpi'||k==='lcsig'||k==='rho') return v.toFixed(2);
                 if(k==='drho'||k==='c3') return v.toFixed(1); return v.toFixed(0); },
    load:loadWeak, compute:computeWeak,
  },
  general: {
    title:'Massive Scalar Exchange (General Mixing)',
    lagrangian:LAG_GEN, xmin:0.01,
    defaults:{m:3.0, lcpi:-1.0, lcsig:0.0, lrho:0.0, dr:0.0, c3:0.0, al:0.0, mus:0.0},
    groups:[['bg','Quadratic theory'],['op','Cubic theory']],
    sliders:[
      ['m','m/H',                   1.5, 5.0, 0.05, 3.0, 'Scalar mass','bg'],
      ['lcpi','log₁₀ c<sub>π</sub>',-2.0,0.0, 0.05,-1.0, 'Goldstone sound-speed','bg'],
      ['lcsig','log₁₀ c<sub>σ</sub>',-1.0,0.0,0.05, 0.0, 'Scalar sound-speed','bg'],
      ['lrho','log₁₀ ρ/H',         -4.0,3.0, 0.05, 0.0, 'Mixing strength','bg'],
      ['dr','Δρ/H',             -5000.,5000.,50., 0.0, '$\\dot{\\pi}^2\\sigma$ exchange','op'],
      ['c3','$\\tilde{c}_3$',      -10.,10., 0.1, 0.0, '$\\dot{\\pi}^3$ self-interaction','op'],
      ['al','α',                   -1.0,1.0, 0.02,0.0, '$\\dot{\\pi}\\sigma^2$ exchange','op'],
      ['mus','$\\mu/H$',           -1.0,1.0, 0.02,0.0, '$\\sigma^3$ exchange','op'],
    ],
    fmt:(k,v)=>{ if(k==='m'||k==='lcpi'||k==='lcsig'||k==='lrho') return v.toFixed(2);
                 if(k==='dr') return v.toFixed(0); if(k==='c3') return v.toFixed(1); return v.toFixed(2); },
    load:loadGeneral, compute:computeGeneral,
  },
};

// ═══════════════ data loading ═══════════════
async function loadWeak(){
  const buf=await (await fetch('shape_data.bin')).arrayBuffer();
  const f64=new Float64Array(buf); let off=0;
  const N_bins=f64[off++],N_mu=f64[off++],N_log10c=f64[off++],N_1d=f64[off++]; off+=2;
  const read=(n)=>{const a=f64.subarray(off,off+n); off+=n; return a;};
  DATAS.weak={ N_bins,N_mu,N_log10c,N_1d,
    xs:read(N_bins), ys:read(N_bins), del_grid:read(N_bins), dot_grid:read(N_bins),
    mu_grid:read(N_mu), log10c_grid:read(N_log10c),
    s_dot_sc:read(N_mu*N_log10c*N_bins), s_del_sc:read(N_mu*N_log10c*N_bins),
    mask_1d:read(N_bins), x_1d:read(N_1d) };
}
async function loadGeneral(){
  const [bR,jR]=await Promise.all([fetch('strong_shape_data.bin'), fetch('strong_factor_coefs.json')]);
  const buf=await bR.arrayBuffer(); COEF=await jR.json();
  const dv=new DataView(buf); let off=0;
  const rd1=()=>{const x=dv.getFloat64(off,true); off+=8; return x;};
  const N_bins=rd1(),N_rho=rd1(),N_mu=rd1(),N_crel=rd1(),N_ops=rd1(),N_1d=rd1(); rd1(); rd1();
  const rdF64=(n)=>{const a=new Float64Array(buf,off,n); off+=8*n; return a;};
  const rdF32=(n)=>{const a=new Float32Array(buf,off,n); off+=4*n; return a;};
  const xs=rdF64(N_bins), ys=rdF64(N_bins);
  const log10rho=rdF64(N_rho), mu_grid=rdF64(N_mu), log10crel=rdF64(N_crel);
  const cubes={}, ncube=N_rho*N_mu*N_crel*N_bins;
  for(const k of OPS) cubes[k]=rdF32(ncube);
  const cond_ratio=rdF32(N_rho*N_mu*N_crel);
  const mask_1d=rdF64(N_bins), x_1d=rdF64(N_1d);
  DATAS.general={ N_bins,N_rho,N_mu,N_crel,N_1d,xs,ys,log10rho,mu_grid,log10crel,cubes,cond_ratio,
    mask_1d,x_1d, LOG10RHO_MIN:log10rho[0], F_pi_base:COEF.F_pi_base };
}

// ═══════════════ 2D grid structure (operates on global DATA) ═══════════════
function buildGrid(){
  const {xs,ys,N_bins}=DATA, r8=v=>Math.round(v*1e8)/1e8;
  const uxS=new Set(), uyS=new Set();
  for(let i=0;i<N_bins;i++){ uxS.add(r8(xs[i])); uyS.add(r8(ys[i])); }
  const ux=[...uxS].sort((a,b)=>a-b), uy=[...uyS].sort((a,b)=>a-b);
  const nx=ux.length, ny=uy.length;
  const xI=new Map(); ux.forEach((v,i)=>xI.set(v,i));
  const yI=new Map(); uy.forEach((v,i)=>yI.set(v,i));
  const binIx=new Int32Array(N_bins), binIy=new Int32Array(N_bins);
  for(let i=0;i<N_bins;i++){ binIx[i]=xI.get(r8(xs[i])); binIy[i]=yI.get(r8(ys[i])); }
  const xEdges=new Array(nx+1); for(let i=0;i<nx;i++) xEdges[i]=ux[i]/sqR; xEdges[nx]=ux[nx-1]*sqR;
  const yEdges=new Array(ny+1); for(let i=0;i<ny;i++) yEdges[i]=uy[i]/sqR; yEdges[ny]=uy[ny-1]*sqR;
  Object.assign(DATA,{ux,uy,nx,ny,binIx,binIy,xEdges,yEdges});
}

// ═══════════════ weak: bilinear interp + model ═══════════════
function interpExchange(arr,mu,log10c){
  const {N_mu,N_log10c,N_bins,mu_grid,log10c_grid}=DATA;
  let imu=0; for(let i=0;i<N_mu-1;i++){ if(mu_grid[i+1]>mu) break; imu=i; } if(imu>=N_mu-1) imu=N_mu-2;
  let ic=0;  for(let i=0;i<N_log10c-1;i++){ if(log10c_grid[i+1]>log10c) break; ic=i; } if(ic>=N_log10c-1) ic=N_log10c-2;
  const tm=Math.max(0,Math.min(1,(mu-mu_grid[imu])/(mu_grid[imu+1]-mu_grid[imu])));
  const tc=Math.max(0,Math.min(1,(log10c-log10c_grid[ic])/(log10c_grid[ic+1]-log10c_grid[ic])));
  const sC=N_bins, sM=N_log10c*N_bins;
  const b00=imu*sM+ic*sC, b10=(imu+1)*sM+ic*sC, b01=imu*sM+(ic+1)*sC, b11=(imu+1)*sM+(ic+1)*sC;
  const w00=(1-tm)*(1-tc), w10=tm*(1-tc), w01=(1-tm)*tc, w11=tm*tc;
  const out=new Float64Array(N_bins);
  for(let b=0;b<N_bins;b++) out[b]=w00*arr[b00+b]+w10*arr[b10+b]+w01*arr[b01+b]+w11*arr[b11+b];
  return out;
}
function computeWeak(p){
  const cpi=Math.pow(10,p.lcpi), csigma=Math.pow(10,p.lcsig), crel=cpi/csigma;
  const mu=Math.sqrt(Math.max(p.m*p.m-9./4.,1e-6));
  const lam1=0.5*(1-cpi*cpi)/(F_pi*F_pi)/(csigma*csigma)*Math.pow(crel,1.5);
  const c3var=p.c3*(1.0/(cpi*cpi)-1.0);
  const lam2=-0.5/(F_pi*F_pi)*Math.pow(crel,1.5)*(1-cpi*cpi+2.0/3.0*c3var);
  const rk1=p.rho*p.rho/(F_pi*F_pi)/(csigma*csigma)*Math.pow(crel,1.5);
  const rk2=p.rho*(p.drho-p.rho)/(F_pi*F_pi)*Math.pow(crel,1.5);
  const N=DATA.N_bins, {del_grid,dot_grid}=DATA;
  const coeff_del=-85.0/324.0*F_pi*F_pi/0.5*Math.pow(crel,-3.5);
  const coeff_dot=10.0/243.0*1.5/0.5*Math.pow(crel,-1.5)*F_pi*F_pi;
  const sc_dot=mu*mu*(Math.pow(crel,-0.5)+0.1*Math.pow(crel,1.5));
  const sc_del=mu*mu*crel*crel*(Math.pow(crel,-0.5)+0.1*Math.pow(crel,1.5));
  const ed=interpExchange(DATA.s_del_sc,mu,Math.log10(crel)), eo=interpExchange(DATA.s_dot_sc,mu,Math.log10(crel));
  const s_self=new Float64Array(N), s_exch=new Float64Array(N), s_tot=new Float64Array(N);
  for(let i=0;i<N;i++){ s_self[i]=lam1*del_grid[i]*coeff_del+lam2*dot_grid[i]*coeff_dot;
    s_exch[i]=rk1*ed[i]/sc_del+rk2*eo[i]/sc_dot; s_tot[i]=s_self[i]+s_exch[i]; }
  return { s_tot, comps:[ {name:'Self-interaction',color:'#1f77b4',s:s_self},
                          {name:'Mixing / exchange',color:'#ff7f0e',s:s_exch},
                          {name:'Total',color:'#000000',s:s_tot} ],
    title1:`m/H=${p.m.toFixed(2)}, c<sub>π</sub>=${cpi.toFixed(2)}, c<sub>σ</sub>=${csigma.toFixed(2)}`,
    title2:`ρ/H=${p.rho.toFixed(1)}, Δρ/H=${p.drho.toFixed(1)}, c̃₃=${p.c3.toFixed(1)}` };
}

// ═══════════════ general: factors + trilinear + model ═══════════════
function cheb(x){ const o=[1.0,x]; for(let n=2;n<=COEF.max_deg;n++) o.push(2*x*o[n-1]-o[n-2]); return o; }
function normedP(rho,mu,crel){
  const m2=mu>=0?9/4+mu*mu:9/4-mu*mu, me2=m2+rho*rho, nm=COEF.norm_min, nM=COEF.norm_max;
  const n0=2*(Math.log10(Math.sqrt(m2))-nm[0])/(nM[0]-nm[0])-1;
  const n1=2*(Math.log10(Math.sqrt(me2))-nm[1])/(nM[1]-nm[1])-1;
  const n2=2*(Math.log10(rho)-nm[2])/(nM[2]-nm[2])-1;
  const n3=2*(Math.log10(crel)-nm[3])/(nM[3]-nm[3])-1;
  const T=[cheb(n0),cheb(n1),cheb(n2),cheb(n3)], degs=COEF.degs, P=new Float64Array(degs.length);
  for(let i=0;i<degs.length;i++){ const d=degs[i]; let v=1.0; for(let a=0;a<4;a++) if(d[a]>0) v*=T[a][d[a]]; P[i]=v; }
  return {P,f:m2/me2,g:1-m2/me2};
}
function factorFromP(co,f,g,P){ let s1=0,s2=0,c1=co.c1,c2=co.c2;
  for(let i=0;i<P.length;i++){ s1+=c1[i]*P[i]; s2+=c2[i]*P[i]; }
  return Math.pow(10, Math.pow(f,co.e1)*s1+Math.pow(g,co.e2)*s2); }
function loc(g,v){ if(v<=g[0]) return [0,0.0]; if(v>=g[g.length-1]) return [g.length-2,1.0];
  let i=0; while(i<g.length-1 && g[i+1]<=v) i++; return [i,(v-g[i])/(g[i+1]-g[i])]; }
function interp3Vec(cube,lr,mu,lc){
  const {N_mu,N_crel,N_bins,log10rho,mu_grid,log10crel}=DATA;
  const [i,fi]=loc(log10rho,lr),[j,fj]=loc(mu_grid,mu),[k,fk]=loc(log10crel,lc);
  const sC=N_bins, sM=N_crel*N_bins, sR=N_mu*N_crel*N_bins;
  const w=[(1-fi)*(1-fj)*(1-fk),(1-fi)*(1-fj)*fk,(1-fi)*fj*(1-fk),(1-fi)*fj*fk,fi*(1-fj)*(1-fk),fi*(1-fj)*fk,fi*fj*(1-fk),fi*fj*fk];
  const b=[i*sR+j*sM+k*sC,i*sR+j*sM+(k+1)*sC,i*sR+(j+1)*sM+k*sC,i*sR+(j+1)*sM+(k+1)*sC,(i+1)*sR+j*sM+k*sC,(i+1)*sR+j*sM+(k+1)*sC,(i+1)*sR+(j+1)*sM+k*sC,(i+1)*sR+(j+1)*sM+(k+1)*sC];
  const out=new Float64Array(N_bins);
  for(let c=0;c<8;c++){ const wc=w[c],bc=b[c]; if(wc===0) continue; for(let n=0;n<N_bins;n++) out[n]+=wc*cube[bc+n]; }
  return out;
}
function interp3Scalar(arr,lr,mu,lc){
  const {N_mu,N_crel,log10rho,mu_grid,log10crel}=DATA;
  const [i,fi]=loc(log10rho,lr),[j,fj]=loc(mu_grid,mu),[k,fk]=loc(log10crel,lc);
  const sM=N_crel, sR=N_mu*N_crel;
  const w=[(1-fi)*(1-fj)*(1-fk),(1-fi)*(1-fj)*fk,(1-fi)*fj*(1-fk),(1-fi)*fj*fk,fi*(1-fj)*(1-fk),fi*(1-fj)*fk,fi*fj*(1-fk),fi*fj*fk];
  const b=[i*sR+j*sM+k,i*sR+j*sM+(k+1),i*sR+(j+1)*sM+k,i*sR+(j+1)*sM+(k+1),(i+1)*sR+j*sM+k,(i+1)*sR+j*sM+(k+1),(i+1)*sR+(j+1)*sM+k,(i+1)*sR+(j+1)*sM+(k+1)];
  let s=0; for(let c=0;c<8;c++) s+=w[c]*arr[b[c]]; return s;
}
function computeGeneral(p){
  const cpi=Math.pow(10,p.lcpi), csigma=Math.pow(10,p.lcsig), crel=cpi/csigma;
  const rho=Math.pow(10,p.lrho), mu=Math.sqrt(Math.max(p.m*p.m-9./4.,1e-6));
  const lr=Math.max(p.lrho,DATA.LOG10RHO_MIN), reff=Math.pow(10,lr), lc=Math.log10(crel);
  const {P,f,g}=normedP(reff,mu,crel);
  const fac={}; for(const k of OPS) fac[k]=factorFromP(COEF[k],f,g,P);
  const S={}; for(const k of OPS){ const v=interp3Vec(DATA.cubes[k],lr,mu,lc), fk=fac[k]; for(let n=0;n<v.length;n++) v[n]*=fk; S[k]=v; }
  const ratio=interp3Scalar(DATA.cond_ratio,lr,mu,lc)*factorFromP(COEF.ratio,f,g,P);
  const Fpi=DATA.F_pi_base*Math.pow(Math.max(ratio,1e-300),0.25), F2=Fpi*Fpi;
  const lam1=0.5*(1-cpi*cpi)/F2/(csigma*csigma)*Math.pow(crel,1.5);
  const lam2=-0.5/F2*Math.pow(crel,1.5)*(1-cpi*cpi);
  const rk1=rho*rho/F2/(csigma*csigma)*Math.pow(crel,1.5);
  const rk2=-rho*rho/F2*Math.pow(crel,1.5);
  const beta=(1/(csigma*csigma)-1)/F2*Math.pow(crel,1.5);
  const Deltarho2=rho*p.dr, c3var=p.c3*(1/(cpi*cpi)-1), rho2alpha=rho*rho*p.al, rho3mu=rho*rho*rho*p.mus;
  const c3coef=-0.5/F2*Math.pow(crel,1.5)*2/3, dr2coef=1/F2*Math.pow(crel,1.5)/rho;
  const N=DATA.N_bins;
  const s_self=new Float64Array(N), s_single=new Float64Array(N), s_double=new Float64Array(N), s_triple=new Float64Array(N), s_tot=new Float64Array(N);
  for(let i=0;i<N;i++){
    s_self[i]  =lam1*S['del2pi_dotpi'][i]+(lam2+c3var*c3coef)*S['dot3pi'][i];
    s_single[i]=rk1*S['del2pi_sigma'][i]/rho+rk2*S['dot2pi_sigma'][i]/rho+Deltarho2*dr2coef*S['dot2pi_sigma'][i];
    s_double[i]=beta*S['delpi_delsigma_dotsigma'][i]+rho2alpha*S['dotpi_sigma2'][i]/(rho*rho);
    s_triple[i]=rho3mu*S['sigma3'][i]/(rho*rho*rho);
    s_tot[i]=s_self[i]+s_single[i]+s_double[i]+s_triple[i];
  }
  return { s_tot, comps:[ {name:'Self-interaction',color:'#1f77b4',s:s_self},
                          {name:'Single exchange',color:'#ff7f0e',s:s_single},
                          {name:'Double exchange',color:'#2ca02c',s:s_double},
                          {name:'Triple exchange',color:'#d62728',s:s_triple},
                          {name:'Total',color:'#000000',s:s_tot} ],
    title1:`m/H=${p.m.toFixed(2)}, c<sub>π</sub>=${cpi.toFixed(2)}, c<sub>σ</sub>=${csigma.toFixed(2)}, ρ/H=${rho.toPrecision(2)}`,
    title2:`Δρ/H=${p.dr.toFixed(0)}, α=${p.al.toFixed(2)}, μ/H=${p.mus.toFixed(2)}` };
}

// ═══════════════ slider UI ═══════════════
function buildSliders(){
  const cont=document.getElementById('slider-groups'); cont.innerHTML=''; sliderEls={}; valEls={};
  const cfg=CFG[MODE];
  for(const [tag,title] of cfg.groups){
    const h=document.createElement('div'); h.className='group-title'; h.textContent=title; cont.appendChild(h);
    const box=document.createElement('div'); cont.appendChild(box);
    for(const sd of cfg.sliders){ if(sd[7]!==tag) continue;
      const [key,label,lo,hi,step,def,desc]=sd;
      const row=document.createElement('div'); row.className='slider-row';
      const d=document.createElement('span'); d.className='slider-desc'; d.innerHTML=desc;
      const l=document.createElement('span'); l.className='slider-label'; l.innerHTML=label;
      const inp=document.createElement('input'); inp.type='range'; inp.min=lo; inp.max=hi; inp.step=step;
      inp.value=(key in cfg.defaults)?cfg.defaults[key]:def; inp.id='sl_'+key;
      const v=document.createElement('span'); v.className='slider-val'; v.textContent=cfg.fmt(key,parseFloat(inp.value));
      row.append(d,l,inp,v); box.appendChild(row);
      sliderEls[key]=inp; valEls[key]=v;
      inp.addEventListener('input',function(){ valEls[key].textContent=cfg.fmt(key,parseFloat(this.value)); requestUpdate(); });
    }
  }
}
function getParams(){ const p={}; for(const k of Object.keys(CFG[MODE].defaults)) p[k]=parseFloat(sliderEls[k].value); return p; }
function resetSliders(){ const cfg=CFG[MODE];
  for(const k of Object.keys(cfg.defaults)){ sliderEls[k].value=cfg.defaults[k]; valEls[k].textContent=cfg.fmt(k,cfg.defaults[k]); }
  requestUpdate(); }

// ═══════════════ plotting ═══════════════
function updatePlots(){
  const cfg=CFG[MODE], p=getParams();
  const {comps,s_tot,title1,title2}=cfg.compute(p);
  const xmin=cfg.xmin;
  const {xs,x_1d,mask_1d,N_bins,N_1d,nx,ny,binIx,binIy,xEdges,yEdges}=DATA;
  const xf=[]; for(let k=0;k<N_1d;k++) if(x_1d[k]>=xmin) xf.push(x_1d[k]);
  const slice=(s)=>{ const out=[]; let j=0;
    for(let i=0;i<N_bins;i++){ if(mask_1d[i]>0.5){ if(x_1d[j]>=xmin) out.push(s[i]/(divideByX?x_1d[j]:1.0)); j++; } } return out; };
  const traces1d=[];
  for(const c of comps){ const arr=slice(c.s);
    if(useLogY){ const xv=[],py=[],ny2=[];
      for(let i=0;i<xf.length;i++){ xv.push(xf[i]); py.push(arr[i]>FLOOR?arr[i]:null); ny2.push(-arr[i]>FLOOR?-arr[i]:null); }
      traces1d.push({x:xv,y:py,name:c.name,mode:'lines',line:{color:c.color,width:2.5},showlegend:true});
      traces1d.push({x:xv,y:ny2,name:c.name+' (neg)',mode:'lines',line:{color:c.color,width:2,dash:'dot'},showlegend:false});
    } else { const xv=[],yv=[]; for(let i=0;i<xf.length;i++){ xv.push(xf[i]); yv.push(arr[i]); }
      traces1d.push({x:xv,y:yv,name:c.name,mode:'lines',line:{color:c.color,width:2.5},showlegend:true}); }
  }
  const layout1d={ title:{text:title1,font:{size:14}},
    xaxis:{type:'log',title:{text:'x = k₁/k₃',font:{size:13}},range:[Math.log10(xmin),0]},
    yaxis:{type:useLogY?'log':'linear',title:{text:divideByX?'S(x,1) / x':'S(x,1)',font:{size:13}},autorange:true},
    legend:{x:0.98,y:0.98,xanchor:'right',yanchor:'top',bgcolor:'rgba(255,255,255,0.85)',bordercolor:'#ccc',borderwidth:1,font:{size:11}},
    margin:{l:65,r:15,t:45,b:55},
    shapes:useLogY?[]:[{type:'line',x0:xmin,x1:1,y0:0,y1:0,xref:'x',yref:'y',line:{color:'#888',width:1,dash:'dash'}}] };
  let vm=0; for(let i=0;i<N_bins;i++) if(xs[i]>=xmin) vm=Math.max(vm,Math.abs(s_tot[i]));
  const z=[]; for(let iy=0;iy<ny;iy++) z.push(new Array(nx).fill(null));
  for(let i=0;i<N_bins;i++) if(xs[i]>=xmin) z[binIy[i]][binIx[i]]=s_tot[i];
  const traceHeatmap={ type:'heatmap',x:xEdges,y:yEdges,z,colorscale:'RdBu',reversescale:false,zmin:-vm,zmax:vm,
    connectgaps:false,hoverongaps:false,colorbar:{title:{text:'S(x,y)',font:{size:13}},len:0.85,thickness:18,exponentformat:'e'},
    hovertemplate:'x=%{x:.3f}<br>y=%{y:.3f}<br>S=%{z:.3e}<extra></extra>' };
  const xline=[],yline=[]; for(let i=0;i<=300;i++){ const xv=i/300; xline.push(xv); yline.push(0.5+Math.abs(0.5-xv)); }
  const geomLine={x:xline,y:yline,mode:'lines',type:'scatter',line:{color:'black',width:1},showlegend:false,hoverinfo:'skip'};
  const layout2d={ title:{text:title2,font:{size:14}},
    xaxis:{title:{text:'x = k₁/k₃',font:{size:13}},range:[0,sqR],constrain:'domain'},
    yaxis:{title:{text:'y = k₂/k₃',font:{size:13}},range:[0.5/sqR,sqR],constrain:'domain',scaleanchor:'x',scaleratio:1},
    margin:{l:65,r:100,t:45,b:55},
    shapes:[{type:'line',x0:0,x1:sqR,y0:1,y1:1,xref:'x',yref:'y',line:{color:'black',width:0.8}}] };
  if(!plotsInitialized){
    Plotly.newPlot('plot1d',traces1d,layout1d,{responsive:true,displayModeBar:false});
    Plotly.newPlot('plot2d',[traceHeatmap,geomLine],layout2d,{responsive:true,displayModeBar:false});
    plotsInitialized=true;
  } else { Plotly.react('plot1d',traces1d,layout1d); Plotly.react('plot2d',[traceHeatmap,geomLine],layout2d); }
}
let _pending=false;
function requestUpdate(){ if(_pending) return; _pending=true; requestAnimationFrame(()=>{ _pending=false; updatePlots(); }); }
function typesetMath(){ if(window.MathJax&&window.MathJax.typesetPromise) window.MathJax.typesetPromise(); else setTimeout(typesetMath,200); }

// ═══════════════ mobile / tabs ═══════════════
function isMobile(){ return window.innerWidth<=800; }
function setActiveTab(tab){ activeTab=tab;
  const a=document.getElementById('plot1d'), b=document.getElementById('plot2d');
  const ba=document.getElementById('tab1d'), bb=document.getElementById('tab2d');
  if(isMobile()){ a.classList.toggle('hidden-mobile',tab!=='1d'); b.classList.toggle('hidden-mobile',tab!=='2d'); }
  else { a.classList.remove('hidden-mobile'); b.classList.remove('hidden-mobile'); }
  ba.classList.toggle('active',tab==='1d'); bb.classList.toggle('active',tab==='2d');
  requestAnimationFrame(()=>Plotly.Plots.resize(tab==='1d'?a:b)); }

// ═══════════════ mode switch ═══════════════
async function switchMode(m){
  MODE=m;
  document.getElementById('btn-weak').classList.toggle('active',m==='weak');
  document.getElementById('btn-gen').classList.toggle('active',m==='general');
  document.querySelector('.lag-body').innerHTML=CFG[m].lagrangian;
  if(!DATAS[m]){
    document.getElementById('app').style.display='none';
    const ld=document.getElementById('loading'); ld.style.display=''; ld.textContent='Loading shape data…';
    try{ await CFG[m].load(); }catch(e){ ld.textContent='Error loading data: '+e.message; return; }
    ld.style.display='none';
  }
  DATA=DATAS[m];
  document.getElementById('app').style.display='';
  if(!DATA.binIx) buildGrid();
  buildSliders();
  Plotly.purge('plot1d'); Plotly.purge('plot2d'); plotsInitialized=false;
  if(isMobile()) setActiveTab(activeTab);
  updatePlots();
  typesetMath();
}

// ═══════════════ init ═══════════════
async function init(){
  document.getElementById('btn-weak').addEventListener('click',()=>{ if(MODE!=='weak') switchMode('weak'); });
  document.getElementById('btn-gen').addEventListener('click',()=>{ if(MODE!=='general') switchMode('general'); });
  document.getElementById('tab1d').addEventListener('click',()=>setActiveTab('1d'));
  document.getElementById('tab2d').addEventListener('click',()=>setActiveTab('2d'));
  window.addEventListener('resize',()=>{ if(isMobile()){ setActiveTab(activeTab); }
    else { document.getElementById('plot1d').classList.remove('hidden-mobile');
           document.getElementById('plot2d').classList.remove('hidden-mobile');
           Plotly.Plots.resize('plot1d'); Plotly.Plots.resize('plot2d'); } });
  const logCB=document.getElementById('logY'); logCB.checked=false;
  logCB.addEventListener('change',()=>{ useLogY=logCB.checked; updatePlots(); });
  const divXCB=document.getElementById('divX'); divXCB.checked=true;
  divXCB.addEventListener('change',()=>{ divideByX=divXCB.checked; updatePlots(); });
  document.getElementById('resetBtn').addEventListener('click',resetSliders);
  await switchMode('weak');
}
init();
</script>
